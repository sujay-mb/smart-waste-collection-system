<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EcoTrack — Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { box-sizing: border-box; }
    body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: linear-gradient(rgba(20,83,45,0.75), rgba(30,125,74,0.75)), url('static/images/Tangible-Benefits.jpg');
    background-size: cover;
    background-position: center;
}
    .login-card {
        background: white;
        border-radius: 14px;
        padding: 40px 36px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .brand {
        text-align: center;
        margin-bottom: 28px;
    }
    .brand i {
        font-size: 32px;
        color: #1e7d4a;
    }
    .brand h1 {
        font-size: 20px;
        color: #14532d;
        margin: 8px 0 2px;
    }
    .brand p {
        font-size: 12.5px;
        color: #6b7280;
        margin: 0;
    }
    label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: #1f2a24;
        margin-top: 16px;
    }
    input {
        width: 100%;
        padding: 10px 12px;
        margin-top: 6px;
        border: 1px solid #e6eae7;
        border-radius: 7px;
        font-size: 13.5px;
        background: #fbfcfb;
    }
    input:focus {
        outline: none;
        border-color: #2e9e5b;
        background: #fff;
    }
    button {
        width: 100%;
        margin-top: 22px;
        padding: 11px;
        background-color: #1e7d4a;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover { background-color: #14532d; }
    #loginError {
        margin-top: 14px;
        font-size: 12.5px;
        color: #e5484d;
        text-align: center;
        display: none;
    }
</style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <i class="fa-solid fa-recycle"></i>
        <h1>EcoTrack</h1>
        <p>Smart Waste Management — Admin Login</p>
    </div>

    <form id="loginForm">
        <label>Username</label>
        <input type="text" id="username" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Log In</button>
        <p id="loginError">Invalid username or password.</p>
    </form>
</div>

<script>
    // Hardcoded credentials — change these to whatever you like
    const VALID_USERNAME = "admin";
    const VALID_PASSWORD = "ecotrack123";

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
            sessionStorage.setItem('ecotrack_logged_in', 'true');
            window.location.href = 'app.html';
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    });
</script>

</body>
</html>
